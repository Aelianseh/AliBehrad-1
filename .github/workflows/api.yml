name: Test React App with Two Local APIs

on:
  push:
    branches: [ first-branch ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start JSON Server APIs
        run: |
          npx json-server --watch DB/db-json.json --port 8000 &
          npx json-server --watch DB/db-logo.json --port 7000 &
      
      - name: Wait for APIs to start
        run: sleep 5

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests