name: zip

on:
  push:
    branches: [ first-branch ]

permissions:
  contents: write

jobs:
  build-and-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build React app
        run: npm run build

      - name: Create ZIP of project
        run: |
          zip -r react-project.zip . -x "node_modules/" ".git/" ".github/**"

      - name: Upload ZIP as GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: zip-${{ github.run_id }}
          name: Auto Release ${{ github.run_id }}
          files: react-project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}